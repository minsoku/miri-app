# Render Blueprint — 저장소 루트의 Dockerfile로 웹 서비스 1개를 무료 플랜에 만든다(README §8).
# 비밀값은 이 파일에 적지 않는다. sync: false 변수는 Blueprint를 처음 만들 때 대시보드가 값을 물어보고(비워 두면 그 기능만 꺼짐),
# 나중에 바꾸거나 추가할 때는 대시보드 Environment 화면에서 넣는다.
services:
  - type: web
    name: miri
    runtime: docker
    plan: free                      # 512MB · 0.1 CPU. 생략하면 유료(starter)로 만들어진다
    region: singapore               # 한국에서 가장 가까운 리전(만든 뒤에는 못 바꿈)
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: MIRI_ADMIN_KEY         # 관리자 API(/admin/*) 키(선택): 공백 없는 영문·숫자·기호 32자 이상, 틀리면 서버가 안 뜸
        sync: false
      - key: KAKAO_REST_API_KEY     # 카카오 로컬 API 키(선택) — 넣으면 장소 검색에 카카오 결과 추가
        sync: false
